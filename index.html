<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calepin — plan et parquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>/*
VOICE   Outil de chantier calme et exact : un plan d'architecte imprimé, typographie suisse.
IDEA    Le calque posé sur le plan — fond blanc, trait noir, rouge pour ce qui demande une action.
PICTURE Le plan lui-même, plein écran, avec les lames de parquet dessinées une à une.
COLOUR  Blanc, noir, rouge signal, chêne pour les lames. Rien d'autre.
TYPE    Inter Tight : 200 pour les grandes valeurs, 600–700 pour les titres, 400 pour le texte. Grille, fer à gauche.
*/
:root{color-scheme:light dark;
  --paper:light-dark(#ffffff,#0e0e0e);--ink:light-dark(#111111,#f2f2f2);--red:light-dark(#e2400c,#ff6a3d);--oak:light-dark(#d9bd94,#a8865b);
  --ink-2:color-mix(in srgb,var(--ink) 62%,var(--paper));--ink-3:color-mix(in srgb,var(--ink) 38%,var(--paper));--ink-4:color-mix(in srgb,var(--ink) 18%,var(--paper));--ink-5:color-mix(in srgb,var(--ink) 6%,var(--paper));
  --oak-cut:color-mix(in srgb,var(--oak) 62%,var(--red));--oak-reuse:color-mix(in srgb,var(--oak) 80%,var(--ink));--oak-line:color-mix(in srgb,var(--oak) 55%,var(--paper));
  --rule:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --hatch:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px);
  --hatch-red:repeating-linear-gradient(135deg,var(--red) 0 1.5px,transparent 1.5px 4.5px);
  --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --top:52px;--sheetw:392px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- structure ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-rows:calc(var(--top) + var(--safe-t)) minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.app{grid-template-columns:minmax(0,1fr) var(--sheetw)}}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:var(--safe-t) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));border-bottom:1px solid var(--ink);background:var(--paper);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.brand b::before{content:"";width:11px;height:11px;background:var(--red);flex:none;transform:translateY(-1px)}
.brand span{font-weight:300;font-size:15px;color:var(--ink-2);max-width:22vw;overflow:hidden;text-overflow:ellipsis}
.floors{display:flex;margin-left:auto;margin-right:auto;border:1px solid var(--ink);overflow-x:auto;scrollbar-width:none;max-width:52vw;touch-action:pan-x;overscroll-behavior-x:contain}
.floors::-webkit-scrollbar{display:none}
.floors button{padding:0 14px;height:34px;font-weight:500;font-size:14px;white-space:nowrap;border-right:1px solid var(--ink)}
.floors button:last-child{border-right:0}
.floors button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:700}
.topact{display:flex;gap:2px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:0}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.ib:disabled{opacity:.3}
@media(max-width:600px){.brand span{display:none}.floors{max-width:60vw}.floors button{padding:0 10px;font-size:13px}}

.stage{position:relative;overflow:hidden;touch-action:none;background:var(--paper)}
.stage canvas#cv{position:absolute;inset:0;display:block;touch-action:none}
.modes{position:absolute;left:12px;top:12px;display:flex;border:1px solid var(--ink);background:var(--paper);z-index:3}
.modes button{height:34px;padding:0 12px;font-size:13px;font-weight:500;border-right:1px solid var(--ink)}
.modes button:last-child{border-right:0}
.modes button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.roomnav{position:absolute;right:12px;top:12px;display:flex;align-items:stretch;border:1px solid var(--ink);background:var(--paper);z-index:3;max-width:calc(100% - 24px)}
.roomnav button{height:34px;min-width:34px;padding:0 10px;font-size:13px}
.roomnav .rn-name{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:1px solid var(--ink);border-right:1px solid var(--ink)}
.roomnav .rn-all{border-left:1px solid var(--ink);font-weight:500}
@media(max-width:640px){.modes{left:8px;top:8px;right:8px;justify-content:stretch}.modes button{flex:1;padding:0 4px;font-size:12px}.roomnav{right:8px;top:50px;left:auto}}

.rail{position:absolute;left:12px;bottom:calc(12px + var(--railb,0px));display:flex;flex-direction:column;border:1px solid var(--ink);background:var(--paper);z-index:3}
.rail button{width:46px;height:46px;display:grid;place-items:center;border-bottom:1px solid var(--rule);position:relative}
.rail button:last-child{border-bottom:0}
.rail button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4}
.rail button[aria-pressed=true]{background:var(--red);color:#fff}
.rail button span{position:absolute;left:54px;white-space:nowrap;background:var(--ink);color:var(--paper);font-size:12px;padding:3px 7px;opacity:0;pointer-events:none;transition:opacity .15s}
@media(hover:hover){.rail button:hover span{opacity:1}}
@media(max-width:899px){.rail{flex-direction:row;left:8px;bottom:calc(8px + var(--railb,0px))}.rail button{border-bottom:0;border-right:1px solid var(--rule)}.rail button:last-child{border-right:0}.rail button span{display:none}}
.zoombox{position:absolute;right:12px;bottom:calc(12px + var(--railb,0px));display:flex;border:1px solid var(--ink);background:var(--paper);z-index:3}
.zoombox button{width:42px;height:42px;display:grid;place-items:center;border-right:1px solid var(--rule)}
.zoombox button:last-child{border-right:0}
.zoombox svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4}
@media(max-width:899px){.zoombox{right:8px;bottom:calc(8px + var(--railb,0px))}}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:58px;background:var(--ink);color:var(--paper);font-size:13px;padding:8px 12px;z-index:4;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;max-width:calc(100% - 24px);width:max-content;border-left:4px solid var(--red)}
.hint b{font-weight:700}
.hint select{height:30px;background:var(--paper);color:var(--ink);border:0;font-size:14px;padding:0 6px;border-radius:0}
.hint[hidden]{display:none}
.hint button{color:var(--paper);font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.hint input{width:84px;height:30px;border:0;padding:0 6px;background:var(--paper);color:var(--ink);font-size:16px}
@media(max-width:640px){.hint{top:96px}}

/* ---------- panneau ---------- */
.sheet{background:var(--paper);display:flex;flex-direction:column;z-index:6;border-left:1px solid var(--ink);min-height:0}
@media(max-width:899px){
  .sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheeth,46vh);border-left:0;border-top:1px solid var(--ink);transition:height .22s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
  .sheet[data-h=min]{--sheeth:calc(112px + var(--safe-b))}.sheet[data-h=half]{--sheeth:48vh}.sheet[data-h=full]{--sheeth:88vh}
}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
@media(max-width:640px){.toast{top:calc(var(--top) + var(--safe-t) + 100px)}}
.grip{display:none;height:20px;place-items:center;cursor:grab;touch-action:none}
.grip i{display:block;width:48px;height:6px;background:var(--hatch)}
@media(max-width:899px){.grip{display:grid}}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ink);flex:none;touch-action:pan-x;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:44px;padding:0 13px;font-size:14px;font-weight:400;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--red)}
.tabs .ts{display:none}
@media(max-width:640px){.tabs{overflow:hidden}.tabs button{flex:1 1 auto;padding:0 6px;font-size:13px}.tabs .hasS{display:none}.tabs .ts{display:inline}}
.panel{overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 40px;flex:1;-webkit-overflow-scrolling:touch}
.panel h2{font-size:28px;line-height:1.04;font-weight:800;letter-spacing:-.03em;margin:0 0 4px;text-wrap:balance}
.panel h3{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin:26px 0 8px;padding-top:9px;border-top:1px solid var(--ink);display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:16px;height:9px;background:var(--hatch);flex:none}
.panel h3:first-child{margin-top:0}
.panel p{margin:6px 0;color:var(--ink-2);font-size:14px}
.lead{font-size:15px;color:var(--ink-2);margin:2px 0 14px}
.big{font-weight:200;font-size:44px;line-height:1;letter-spacing:-.03em}
.big small{font-size:16px;font-weight:400;letter-spacing:0;margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin:12px 0}
.kpis div{padding:10px 8px 10px 0}
.kpis b{display:block;font-weight:200;font-size:30px;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.kpis span{font-size:12px;color:var(--ink-2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:44px;padding:0 16px;border:1px solid var(--ink);background:var(--paper);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:var(--rule)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.35}
.link{color:var(--red);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.field label{font-size:14px;color:var(--ink-2)}
.field input,.field select{height:40px;border:1px solid var(--rule);background:var(--paper);padding:0 10px;font-size:16px;width:100%;border-radius:0}
.field input:focus,.field select:focus{border-color:var(--ink);outline:none}
.unit{display:flex;align-items:center;gap:6px}.unit span{font-size:13px;color:var(--ink-2);white-space:nowrap}
input[type=checkbox]{accent-color:var(--red);width:20px;height:20px}
.list{border-top:1px solid var(--ink)}
.item{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.item .nm{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:13px;color:var(--ink-2);white-space:nowrap}
.item .v{font-weight:200;font-size:22px;white-space:nowrap}
.item[aria-current=true] .nm{color:var(--red)}
.tag{font-size:11px;font-weight:600;border:1px solid currentColor;padding:1px 5px;white-space:nowrap}
.tag.red{color:var(--red)}
.dims{width:100%;border-collapse:collapse;font-size:14px}
.dims th{text-align:left;font-size:12px;font-weight:500;color:var(--ink-2);padding:6px 4px;border-bottom:1px solid var(--ink)}
.dims td{padding:5px 4px;border-bottom:1px solid var(--rule);vertical-align:middle}
.dims td:first-child{font-weight:600;width:42px}
.wname{font-weight:700;font-size:14px;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:4px;min-height:36px}
.wname.lk::after{content:"";display:inline-block;width:6px;height:6px;background:var(--red);margin-left:4px;vertical-align:2px}
.dims input{height:38px;width:100%;border:1px solid var(--rule);padding:0 6px;font-size:16px;text-align:right;background:var(--paper)}
.lock{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--rule)}
.lock svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.lock[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.advice{list-style:none;margin:8px 0;padding:0;counter-reset:a}
.advice li{padding:10px 0 10px 30px;border-bottom:1px solid var(--rule);position:relative;font-size:14px;line-height:1.45}
.advice li::before{counter-increment:a;content:counter(a);position:absolute;left:0;top:10px;font-weight:700;font-size:13px}
.advice li.warn::before{color:var(--red)}
.advice li.warn{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin:8px 0}
.legend i{display:inline-block;width:18px;height:10px;margin-right:5px;vertical-align:-1px}
.cuts{width:100%;border-collapse:collapse;font-size:13px}
.cuts th{text-align:left;font-weight:500;color:var(--ink-2);border-bottom:1px solid var(--ink);padding:5px 4px}
.cuts td{border-bottom:1px solid var(--rule);padding:5px 4px;text-align:right;white-space:nowrap}
.cuts td:first-child,.cuts th:first-child{text-align:left}
.cuts td.r{color:var(--red);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.tile{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px;min-height:96px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile b{font-size:13px;font-weight:600;line-height:1.25}
.tile small{font-size:12px;color:var(--ink-2)}
.tile svg{width:100%;height:42px;stroke:var(--ink);fill:none;stroke-width:1.2}
.tile canvas{width:30px;height:30px}
.tile[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.tile[aria-pressed=true] small{color:var(--paper)}
.tile[aria-pressed=true] svg{stroke:var(--paper)}
.seg{display:flex;border:1px solid var(--ink);margin:6px 0}
.seg button{flex:1;height:38px;font-size:13px;border-right:1px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:600}
.drop{border:1px dashed var(--ink-3);padding:22px 16px;text-align:center;display:block;cursor:pointer}
.drop b{display:block;font-size:17px;font-weight:600}
.drop span{font-size:13px;color:var(--ink-2)}
.drop input{display:none}
.pages{border-top:1px solid var(--ink)}
.empty{padding:8px 0 4px}
.empty .big{font-size:52px}
.empty{position:relative}.empty::before{content:"";display:block;height:28px;background:var(--hatch);margin:0 0 16px;opacity:.6}
.note{font-size:13px;color:var(--ink-2);border-left:3px solid var(--red);padding:2px 0 2px 10px;margin:12px 0}
details{border-bottom:1px solid var(--rule)}
summary{min-height:44px;display:flex;align-items:center;font-weight:600;font-size:14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-weight:300;font-size:20px}
details[open] summary::after{content:"–"}
.progress{height:3px;background:var(--rule);margin:10px 0}
.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}

/* ---------- popover / modale / toast ---------- */
.pop{position:fixed;z-index:20;background:var(--paper);border:1px solid var(--ink);padding:12px;min-width:220px;box-shadow:0 8px 30px color-mix(in srgb,var(--ink) 18%,transparent)}
.pop[hidden],.modal[hidden]{display:none}
.pop label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:6px}
.pop .row input[type=text],.pop .row input[type=number],.pop input.num{height:44px;width:120px;font-size:20px;font-weight:300;border:1px solid var(--ink);padding:0 8px;text-align:right;background:var(--paper)}
.modal{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--paper);border:1px solid var(--ink);padding:20px;width:min(440px,100%);max-height:86vh;overflow:auto}
.modal h4{margin:0 0 6px;font-size:20px;font-weight:700}
.modal p{color:var(--ink-2);font-size:14px;margin:6px 0 14px}
.modal textarea{width:100%;min-height:140px;border:1px solid var(--rule);font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;background:var(--paper)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + var(--safe-t) + 58px);background:var(--ink);color:var(--paper);padding:9px 14px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 24px)}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- interface contextuelle ---------- */
.opbar{position:absolute;z-index:4;display:flex;align-items:stretch;background:var(--ink);color:var(--paper);height:42px;white-space:nowrap;visibility:hidden;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 22%,transparent);touch-action:manipulation}
.opbar[hidden]{display:none}
.opbar button{padding:0 13px;font-size:13px;font-weight:600;color:var(--paper);border-right:1px solid color-mix(in srgb,var(--paper) 22%,var(--ink));min-width:44px}
.opbar button:last-child{border-right:0}
.opbar button.ok{background:var(--red);color:#fff;font-weight:800}
.opbar button:disabled{opacity:.4}
.opbar .ob-v{display:flex;align-items:center;padding:0 12px;font-weight:800;font-size:15px;letter-spacing:-.01em;color:var(--red);background:var(--paper);border:2px solid var(--ink)}
.opbar .ob-n{display:flex;align-items:center;padding:0 12px;font-size:12px;color:color-mix(in srgb,var(--paper) 75%,var(--ink))}
@media(max-width:400px){.opbar .ob-n{display:none}}
.ctxhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px;padding-bottom:10px;position:relative}
.ctxhead::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:7px;background:var(--hatch)}
.ctxhead h2{margin:0!important}
.big2{font-weight:200;font-size:44px;line-height:.86;letter-spacing:-.035em;white-space:nowrap}
.big2 small{font-size:15px;font-weight:600;margin-left:3px;letter-spacing:0}
.ctxhead + .lead{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chips button{height:32px;padding:0 11px;border:1px solid var(--rule);font-size:13px;font-weight:500}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.chips.sm{margin:6px 0 2px}.chips.sm button{height:30px;min-width:46px;padding:0 8px;font-variant-numeric:tabular-nums}
.chipnote{font-size:12px;color:var(--ink-2);align-self:center;margin-left:4px}
.picker{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.picker button{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;min-height:120px;position:relative}
.picker svg{width:72px;height:72px;overflow:visible}
.picker svg .w{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:butt}
.picker svg .l{stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round}
.picker svg .a{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:2.5 2.5;fill:none}
.picker b{font-size:13px;font-weight:700;line-height:1.2}
.picker small{font-size:11.5px;color:var(--ink-2)}
.picker button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--red);background:color-mix(in srgb,var(--red) 7%,var(--paper))}
.picker button[aria-pressed=true] svg .l{stroke:var(--red)}
.picker button[aria-pressed=true] svg .a{stroke:var(--red)}

<script>
/* Calepin — géométrie de base. Unités : mm, repère y vers le haut, polygones CCW. */
(function () {
  const PL = (globalThis.PL = globalThis.PL || {});
  const G = {};
  const EPS = 1e-9;
  G.EPS = EPS;
  G.v = (x, y) => ({ x, y });
  G.add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
  G.sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  G.mul = (a, k) => ({ x: a.x * k, y: a.y * k });
  G.dot = (a, b) => a.x * b.x + a.y * b.y;
  G.cross = (a, b) => a.x * b.y - a.y * b.x;
  G.len = (a) => Math.hypot(a.x, a.y);
  G.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  G.norm = (a) => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; };
  G.lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  G.rot = (p, ang) => { const c = Math.cos(ang), s = Math.sin(ang); return { x: p.x * c - p.y * s, y: p.x * s + p.y * c }; };
  G.rotAround = (p, o, ang) => G.add(o, G.rot(G.sub(p, o), ang));
  G.perp = (a) => ({ x: -a.y, y: a.x });
  G.normAng = (a) => { while (a <= -Math.PI) a += 2 * Math.PI; while (a > Math.PI) a -= 2 * Math.PI; return a; };
  G.deg = (r) => (r * 180) / Math.PI;
  G.rad = (d) => (d * Math.PI) / 180;
  G.clone = (pts) => pts.map((p) => ({ x: p.x, y: p.y }));

  G.area = (P) => { let s = 0; for (let i = 0, n = P.length; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; s += a.x * b.y - b.x * a.y; } return s / 2; };
  G.perimeter = (P) => { let s = 0; for (let i = 0; i < P.length; i++) s += G.dist(P[i], P[(i + 1) % P.length]); return s; };
  G.centroid = (P) => {
    const A = G.area(P); if (Math.abs(A) < EPS) { let x = 0, y = 0; P.forEach((p) => { x += p.x; y += p.y; }); return { x: x / P.length, y: y / P.length }; }
    let cx = 0, cy = 0; for (let i = 0, n = P.length; i < n; i++) { const a = P[i], b = P[(i + 1) % n], f = a.x * b.y - b.x * a.y; cx += (a.x + b.x) * f; cy += (a.y + b.y) * f; }
    return { x: cx / (6 * A), y: cy / (6 * A) };
  };
  G.bbox = (pts) => { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const p of pts) { if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y; } return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 }; };
  G.ensureCCW = (P) => (G.area(P) < 0 ? P.slice().reverse() : P);

  G.pointInPoly = (p, P) => {
    let inside = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const a = P[i], b = P[j];
      if ((a.y > p.y) !== (b.y > p.y) && p.x < ((b.x - a.x) * (p.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
    }

  };

  G.distPointPoly = (p, P) => { let m = Infinity; for (let i = 0; i < P.length; i++) m = Math.min(m, G.distPointSeg(p, P[i], P[(i + 1) % P.length])); return m; };

  /* intersection de segments [a,b] et [c,d] : renvoie {t,u,p} ou null */
  G.segInter = (a, b, c, d) => {
    const r = G.sub(b, a), s = G.sub(d, c), den = G.cross(r, s);
    if (Math.abs(den) < EPS) return null;
    const qp = G.sub(c, a), t = G.cross(qp, s) / den, u = G.cross(qp, r) / den;
    return { t, u, p: { x: a.x + r.x * t, y: a.y + r.y * t } };

  G.lineInter = (p1, d1, p2, d2) => { const den = G.cross(d1, d2); if (Math.abs(den) < 1e-12) return null; const t = G.cross(G.sub(p2, p1), d2) / den; return { x: p1.x + d1.x * t, y: p1.y + d1.y * t }; };

    const n = P.length; if (n < 3 || !d) return G.clone(P);

    for (let i = 0; i < n; i++) {
      const a = P[i], b = P[(i + 1) % n], dir = G.norm(G.sub(b, a)), nrm = G.perp(dir);
      lines.push({ p: G.add(a, G.mul(nrm, d)), d: dir });
    }
    const out = [];
    for (let i = 0; i < n; i++) {
      const L0 = lines[(i - 1 + n) % n], L1 = lines[i];
      const q = Math.abs(G.cross(L0.d, L1.d)) < 1e-6 ? L1.p : G.lineInter(L0.p, L0.d, L1.p, L1.d);
      out.push(q || L1.p);
    }
    return out;
  };

  /* Douglas–Peucker */
  G.simplifyDP = (pts, tol, closed) => {
    if (pts.length < 3) return pts.slice();
    const rec = (arr, i0, i1, keep) => {
      let md = -1, mi = -1; const a = arr[i0], b = arr[i1];
      for (let i = i0 + 1; i < i1; i++) { const d = G.distPointSeg(arr[i], a, b); if (d > md) { md = d; mi = i; } }
      if (md > tol) { keep[mi] = 1; rec(arr, i0, mi, keep); rec(arr, mi, i1, keep); }
    };
    if (!closed) { const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1; rec(pts, 0, pts.length - 1, keep); return pts.filter((_, i) => keep[i]); }
    // fermé : partir des deux points les plus éloignés
    let far = 0, fd = -1; for (let i = 1; i < pts.length; i++) { const d = G.dist(pts[0], pts[i]); if (d > fd) { fd = d; far = i; } }
    const arr = pts.concat([pts[0]]); const keep = new Uint8Array(arr.length); keep[0] = keep[far] = keep[arr.length - 1] = 1;
    rec(arr, 0, far, keep); rec(arr, far, arr.length - 1, keep);
    return arr.slice(0, -1).filter((_, i) => keep[i]);
  };

  /* retire points doublons et colinéaires */
  G.cleanPoly = (P, angTolDeg = 0.5, distTol = 1) => {
    let pts = P.slice(); let changed = true; const tol = G.rad(angTolDeg);
    while (changed && pts.length > 3) {
      changed = false;
      for (let i = 0; i < pts.length && pts.length > 3; i++) {
        const a = pts[(i - 1 + pts.length) % pts.length], b = pts[i], c = pts[(i + 1) % pts.length];
        if (G.dist(a, b) < distTol) { pts.splice(i, 1); changed = true; break; }
        const t = Math.abs(G.normAng(Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(b.y - a.y, b.x - a.x)));
        if (t < tol || G.distPointSeg(b, a, c) < distTol * 0.5) { pts.splice(i, 1); changed = true; break; }
      }
    }
    return pts;
  };

  /* intervalles [x0,x1] d'un ensemble d'anneaux (pair-impair) coupé à la hauteur y */
  G.intervalsAtY = (rings, y) => {
    const xs = [];
    for (const R of rings) for (let i = 0, n = R.length; i < n; i++) {
      const a = R[i], b = R[(i + 1) % n];
      if ((a.y > y) !== (b.y > y)) xs.push(a.x + ((y - a.y) * (b.x - a.x)) / (b.y - a.y));
    }
    xs.sort((p, q) => p - q); const out = [];
    for (let i = 0; i + 1 < xs.length; i += 2) if (xs[i + 1] - xs[i] > 1e-6) out.push([xs[i], xs[i + 1]]);
    return out;
  };
  G.mergeIntervals = (list, gap = 0) => {
    const s = list.filter((iv) => iv[1] > iv[0]).sort((a, b) => a[0] - b[0]); const out = [];
    for (const iv of s) { if (out.length && iv[0] <= out[out.length - 1][1] + gap) out[out.length - 1][1] = Math.max(out[out.length - 1][1], iv[1]); else out.push(iv.slice()); }
    return out;
  };
  G.subtractIntervals = (A, B) => {
    let res = A.map((a) => a.slice());
    for (const b of B) { const nx = []; for (const a of res) { if (b[1] <= a[0] || b[0] >= a[1]) { nx.push(a); continue; } if (b[0] > a[0]) nx.push([a[0], b[0]]); if (b[1] < a[1]) nx.push([b[1], a[1]]); } res = nx; }
    return res.filter((a) => a[1] - a[0] > 1e-6);
  };
  G.isSelfIntersecting = (P) => {
    const n = P.length;
    for (let i = 0; i < n; i++) for (let j = i + 2; j < n; j++) {
      if (i === 0 && j === n - 1) continue;
      const r = G.segInter(P[i], P[(i + 1) % n], P[j], P[(j + 1) % n]);
      if (r && r.t > 1e-6 && r.t < 1 - 1e-6 && r.u > 1e-6 && r.u < 1 - 1e-6) return true;
    }
    return false;
  };
  G.regular = (n, r, c = { x: 0, y: 0 }, a0 = 0) => Array.from({ length: n }, (_, i) => ({ x: c.x + r * Math.cos(a0 + (2 * Math.PI * i) / n), y: c.y + r * Math.sin(a0 + (2 * Math.PI * i) / n) }));
  G.rect = (x, y, w, h) => [{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }];

  /* découpe d'un polygone par un demi-plan : garde dot(p - o, n) >= off */
  G.clipHalf = (P, o, n, off = 0) => {
    const out = [], f = (p) => (p.x - o.x) * n.x + (p.y - o.y) * n.y - off;
    for (let i = 0; i < P.length; i++) {
      const a = P[i], b = P[(i + 1) % P.length], fa = f(a), fb = f(b);
      if (fa >= 0) out.push(a);
      if ((fa >= 0) !== (fb >= 0)) { const t = fa / (fa - fb); out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }); }
    }
    return out;
  };
  /* aire d'intersection approximative de deux polygones (échantillonnage) */
  G.overlapArea = (A, B, step = 50) => {
    const bb = G.bbox(A), bb2 = G.bbox(B); const x0 = Math.max(bb.x0, bb2.x0), x1 = Math.min(bb.x1, bb2.x1), y0 = Math.max(bb.y0, bb2.y0), y1 = Math.min(bb.y1, bb2.y1);
    if (x1 <= x0 || y1 <= y0) return 0; let s = 0;
    for (let y = y0 + step / 2; y < y1; y += step) { const ia = G.intervalsAtY([A], y), ib = G.intervalsAtY([B], y); for (const a of ia) for (const b of ib) { const l = Math.min(a[1], b[1]) - Math.max(a[0], b[0]); if (l > 0) s += l * step; } }
    return s;
  };

  PL.geom = G;
})();

/* Calepin — opérations sur des pièces à angles droits, par quadrillage.
   On travaille dans un repère tourné (les murs y sont horizontaux ou verticaux) : toutes les abscisses et
   ordonnées des sommets forment une grille ; chaque case est dedans ou dehors ; on retrace le contour des
   cases gardées. Robuste aux bords communs (le cas normal quand on redécoupe une pièce le long de ses murs). */
(function () {
  const PL = (globalThis.PL = globalThis.PL || {}), G = PL.geom;
  const O = (PL.ortho = {});

  O.frame = (th) => ({ to: (p) => G.rot(p, -th), from: (p) => G.rot(p, th) });

    let best = 0, ang = 0;

    const q = Math.PI / 2; ang = ((ang % q) + q) % q; return ang > q - 1e-4 ? 0 : ang;
  };

    const n = P.length; const type = [];

    if (type.includes('D')) return null;
    const out = P.map((p) => ({ x: p.x, y: p.y }));
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; if (type[i] === 'H') { const y = (P[i].y + P[j].y) / 2; out[i].y = y; out[j].y = y; } }
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; if (type[i] === 'V') { const x = (P[i].x + P[j].x) / 2; out[i].x = x; out[j].x = x; } }
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; if (type[i] === 'H') out[j].y = out[i].y; } // la dernière passe l'emporte sur les côtés horizontaux
    return out;

  /* contours (dans le repère) de l'ensemble des cases gardées : boucles extérieures (aire > 0) et trous (aire < 0) */
  O.trace = (xs, ys, inside) => {
    const nx = xs.length - 1, ny = ys.length - 1; if (nx < 1 || ny < 1) return [];
    const In = []; for (let i = 0; i < nx; i++) { In.push([]); for (let j = 0; j < ny; j++) In[i].push(!!inside((xs[i] + xs[i + 1]) / 2, (ys[j] + ys[j + 1]) / 2, i, j)); }
    const at = (i, j) => i >= 0 && j >= 0 && i < nx && j < ny && In[i][j];
    const E = new Map(); const add = (a, b) => { const k = a[0] + ',' + a[1]; if (!E.has(k)) E.set(k, []); E.get(k).push({ a, b, used: false }); };
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
      if (!In[i][j]) continue;
      if (!at(i, j - 1)) add([i, j], [i + 1, j]);
      if (!at(i + 1, j)) add([i + 1, j], [i + 1, j + 1]);
      if (!at(i, j + 1)) add([i + 1, j + 1], [i, j + 1]);
      if (!at(i - 1, j)) add([i, j + 1], [i, j]);
    }
    const loops = [];
    for (const list of E.values()) for (const e0 of list) {
      if (e0.used) continue; const loop = []; let cur = e0;

  function detectScale(raw, lines) {

  /* ---------- passage au monde (mm, y vers le haut) ---------- */

      curves: raw.curves.map((c) => ({ p0: T(c.p0), c1: T(c.c1), c2: T(c.c2), p3: T(c.p3), st: c.st })),

  /* ---------- angle dominant ---------- */

  /* ---------- calques : rôle de chaque style ---------- */

    const segs = W.segs; const grid = new Grid(1000);

  /* ---------- graphe planaire & faces ---------- */

  function splitSegments(segs, tol) {

    const cuts = segs.map(() => [0, 1]);

  /* ponts : referment les ouvertures (portes, fenêtres, passages) entre extrémités de murs alignées */

    const grid = new Grid(maxG); pts.forEach((p, i) => grid.insertBox(p.x, p.y, p.x, p.y, i));
    const segGrid = new Grid(1000); segs.forEach((s, i) => { const b = segBox(s, 2); segGrid.insertBox(b[0], b[1], b[2], b[3], i); });

  function regularize(P, dom, tolDeg = 1.5) {

  /* ---------- détection principale ---------- */
  const AREA_RE = /^(SS|SH|S\.?\s?H|S\.?\s?S|SU|S)?\s*[:=]?\s*(\d+[.,]\d+)\s*m?\s*[²2]?$/i;
  const BAD_NAME = /^(AF|VR|BSO|VMC|EU|AXE|Brut|Contre|Cloison|Trappe|Linge|Chute|MOUSTIQUAIRE|ITE|SOUS-FACE|LINTEAUX|PIED-DROIT|CHARPENTE|CROUPE|KLIMA|ABF|Ech|N)\b/i;

  function prepare(raw, k, o = {}) {
    const lines = PL.pdfvec ? PL.pdfvec.mergeTextLines(raw.texts) : raw.texts;
    const W = toWorld(raw, k);
    const texts = lines.map((t) => textToWorld(t, raw, k));
    const cotes = o.cotes || findCotes(raw, lines);
    const strokeSt = raw.styles.map((st) => st.kind !== 'F');
    const grid = new Grid(40); raw.segs.forEach((s, i) => { if (strokeSt[s.st]) { const b = segBox(s); grid.insertBox(b[0], b[1], b[2], b[3], i); } });
    cotes.forEach((c) => {
      let best = null; const R = c.text.h * 1.5 + c.text.w;
      grid.query(c.c.x - R, c.c.y - R, c.c.x + R, c.c.y + R, (i) => { const s = raw.segs[i]; const sd = G.sub(s.b, s.a); if (Math.abs(G.cross(sd, c.dir)) / (G.len(sd) || 1) > 0.035) return; const d = G.distPointSeg(c.c, s.a, s.b); if (d < c.text.h * 1.4 && (!best || d < best.d)) best = { d, st: s.st }; });

    const byStyle = {}; W.segs.forEach((s, i) => { (byStyle[s.st] = byStyle[s.st] || []).push(i); });
    for (const st of an.styles) {
      const ids = byStyle[st.i] || []; if (ids.length < 6) { st.dashed = 0; continue; }

      let dash = 0, tot = ids.length;
      for (const i of ids) {
        const s = W.segs[i], d = G.sub(s.b, s.a), l = G.len(d); if (l > 700 || l < 1) continue;
        const u = G.mul(d, 1 / l); let before = false, after = false; const b = segBox(s, 320);

  /* retire les petites saillies vers l'extérieur (embrasures de fenêtres, niches de portes) */

  function buildRooms(ctx, roles, o, light) {

    const dom = dominantAngle(W.segs.filter((s) => roles[s.st] === 'mur'));
    const isWall = W.segs.map((s, i) => roles[s.st] === 'mur' && an.paired[i]);
    const wall = []; W.segs.forEach((s, i) => { if (isWall[i]) wall.push(s); });
    {
      const g0 = buildGraph(wall, o.tol * 2);

  function name(rooms, texts) {

  /* choix automatique des calques de murs : sélection gloutonne guidée par les surfaces écrites sur le plan */
  function autoRoles(ctx, o, onProgress) {
    const st = ctx.an.styles;
    const base = st.map((s) => (s.role === 'mur' ? 'cand' : s.role));
    const cands = st.filter((s) => base[s.i] === 'cand').sort((a, b) => b.paired - a.paired);
    const mk = (set) => st.map((s) => (set.has(s.i) ? 'mur' : base[s.i] === 'cand' ? 'autre' : base[s.i]));

  function detect(raw, k, opts = {}) {

  }

  /* ---------- zones sous 1,80 m (lignes « 1 m 80 » des combles) ---------- */
  function detectLowCeiling(ctx, rooms) {

  /* ---------- escaliers ---------- */
  function detectStairs(W, texts, roles, an) {
    const nums = texts.filter((t) => /^\d{1,2}$/.test(t.s)).map((t) => ({ ...t, v: +t.s }));
    const out = []; const usedT = new Set();
    if (nums.length) {
      const hMed = nums.map((t) => t.h).sort((a, b) => a - b)[Math.floor(nums.length / 2)];
      for (const s1 of nums.filter((t) => t.v === 1)) {
        if (usedT.has(s1)) continue;
        const chain = [s1]; let cur = s1;
        for (;;) { const nx = nums.filter((t) => t.v === cur.v + 1 && !usedT.has(t) && G.dist(t, cur) < 700 && t.h < hMed * 1.6).sort((a, b) => G.dist(a, cur) - G.dist(b, cur))[0]; if (!nx) break; chain.push(nx); cur = nx; }

      }

    for (const st of out) {
      const near = texts.filter((t) => G.pointInPoly(t, st.pts) || G.distPointPoly(t, st.pts) < 800);
      if (near.some((t) => /mont|^m$|up|↑/i.test(t.s))) st.mark = 'monte';

      <p class="note">PDF d'architecte, export magicplan (DXF, SVG, PDF, image) : les pièces, les cotes et les escaliers sont détectés automatiquement.</p></div>`;
    return `<h2>${esc(f.name)}</h2><p class="lead">${rooms.length} pièce${rooms.length > 1 ? 's' : ''} · ${App.fmtM2(total)} m² au sol</p>
      <div class="row" style="margin:4px 0 14px"><button class="btn sm" data-a="addRect">+ Pièce</button><button class="btn sm" data-a="draw">Tracer</button><button class="btn sm" data-a="addLib" data-v="poteau20">+ Poteau</button><button class="btn sm" data-a="addLib" data-v="tremie">+ Zone sans parquet</button><button class="btn sm" data-a="drawKind" data-v="plafond">+ Plafond bas</button></div>
      ${(() => { const list = rooms.filter((r) => App.walls.countFixable(r)); const n = list.length; return n ? `<div class="preview"><b>${n} pièce${n > 1 ? 's' : ''} à simplifier</b> — ${esc(list.map((r) => r.name || 'Pièce').join(', '))} : des murs font de petits décrochements (embrasures de fenêtres ou de portes, châssis lus comme des murs).<div class="row" style="margin-top:8px"><button class="btn sm red" data-x="fixall">Simplifier les pièces</button></div></div>` : ''; })()}
      <div class="field" style="border-top:1px solid var(--ink)"><label>Hauteur sous plafond de l'étage</label><div class="unit"><input data-c="fceil" inputmode="decimal" value="${f.ceiling || 250}"><span>cm</span></div></div>
      <div class="list" style="margin-top:14px">${rooms.map((r) => `<button class="item" data-a="sel" data-v="${r.id}"><span class="nm">${esc(r.name || 'Pièce')}</span>${r.parquet === false ? '<span class="tag">sans parquet</span>' : ''}${r.locked ? '<span class="tag">verrouillée</span>' : ''}<span class="v">${App.fmtM2(Math.abs(G.area(r.pts)))}<small style="font-size:12px"> m²</small></span></button>`).join('')}</div>
      ${others.length ? `<h3>Escaliers, poteaux et zones</h3><div class="list">${others.map((r) => `<button class="item" data-a="sel" data-v="${r.id}"><span class="nm">${esc(r.name || KIND[r.kind])}</span><span class="meta">${KIND[r.kind]}${r.kind === 'escalier' && r.stair ? ' · ' + (r.stair.dir === 'descend' ? 'descend' : 'monte') : ''}</span></button>`).join('')}</div>` : ''}
      ${meubles.length ? `<h3>Mobilier</h3><p>${meubles.length} élément${meubles.length > 1 ? 's' : ''} — onglet Mobilier.</p>` : ''}
      <h3>Mesures</h3>${App.measuresOn().length ? `<div class="list">${App.measuresOn().map((m, i) => `<button class="item" data-a="sel" data-v="${m.id}"><span class="nm">${esc(m.label || 'Mesure ' + (i + 1))}</span><span class="v">${App.fmtCm(G.dist(m.a, m.b))}<small style="font-size:12px"> cm</small></span></button>`).join('')}</div>` : '<p>Outil Règle : glissez entre deux points du plan pour mesurer au millimètre, avec aimantation sur les angles et les murs.</p>'}`;
  }

  /* ----- Inspecteur ----- */
  function inspector(s) {
    const back = `<button class="link" data-a="back" style="margin-bottom:10px">← ${S.tab === 'pieces' ? 'Toutes les pièces' : 'Retour'}</button>`;
    if (s.kind === 'elec') return back + inspElec(s);
    if (s.a && s.b) return back + inspMeasure(s);
    const n = s.pts.length, m = PL.solver.measure(s.pts), area = Math.abs(G.area(s.pts));
    let h = back + `<div class="field" style="border-top:1px solid var(--ink)"><label>Nom</label><input data-live="name" data-c="name" value="${esc(s.name || '')}"></div>
      <div class="field"><label>Type</label><select data-c="kind">${Object.entries(KIND).map(([k, v]) => `<option value="${k}" ${s.kind === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="kpis"><div><b>${App.fmtM2(area)}</b><span>m² au sol</span></div><div><b>${fmt(G.perimeter(s.pts) / 1000, 2)}</b><span>m de périmètre</span></div><div><b>${n}</b><span>côtés</span></div></div>
      <div class="row"><button class="btn sm ${s.locked ? 'primary' : ''}" data-a="lockpos">${s.locked ? 'Verrouillé sur le plan' : 'Verrouiller sur le plan'}</button><button class="btn sm" data-a="zoom">Zoomer</button><button class="btn sm" data-a="dup">Dupliquer</button><button class="btn sm ghost" data-a="del">Supprimer</button></div>`;
    if (s.kind === 'piece') {
      const hab = App.feat.habitable(s); const nb = App.feat.neighbours(s);
      if (hab.low > 0) h += `<p style="margin-top:10px">Surface à plus de 1,80 m : <b style="color:var(--ink)">${App.fmtM2(hab.SH)} m²</b>${s.areaSH ? ' (plan : ' + s.areaSH.toLocaleString('fr-FR') + ' m²)' : ''}</p>`;
      h += `<div class="field" style="margin-top:10px"><label>Parquet dans cette pièce</label><input type="checkbox" data-c="parquet" ${s.parquet !== false ? 'checked' : ''}></div>
        <div class="field"><label>Hauteur sous plafond</label><div class="unit"><input data-c="ceil" inputmode="decimal" placeholder="${App.feat.ceiling(Object.assign({}, s, { ceiling: null }))}" value="${s.ceiling || ''}"><span>cm</span></div></div>
        <h3>Transformer</h3><div class="row"><button class="btn sm" data-a="cut">Ajouter une cloison</button>${nb.length ? `<select id="mergeWith" style="height:36px;border:1px solid var(--rule);background:var(--paper);padding:0 8px">${nb.map((r) => `<option value="${r.id}">${esc(r.name || 'Pièce')}</option>`).join('')}</select><button class="btn sm" data-a="merge">Fusionner</button>` : ''}</div>
        ${(() => { const st = App.stairs.stairsTouching(s).filter(() => Math.abs(G.area(s.pts)) < 8e6); return st.length ? `<div class="preview"><b>Partie d'escalier ?</b> Cette pièce touche ${esc(st[0].name || 'l\'escalier')}. Si c'est son palier ou ses marches tournantes, réunissez-les.<div class="row" style="margin-top:8px"><button class="btn sm red" data-x="stjoin2" data-v="${st[0].id}">Assembler à l'escalier</button></div></div>` : ''; })()}
        <p>Touchez un mur sur le plan (ou son nom ci-dessous) pour passer en mode cloison : verrou, longueur, déplacement avec aperçu avant validation.</p>`;
    }
    if (s.kind === 'plafond') h += `<h3>Hauteur</h3><div class="field"><label>Hauteur basse (pied-droit)</label><div class="unit"><input data-c="hmin" inputmode="decimal" value="${s.hmin ?? ''}"><span>cm</span></div></div><div class="field"><label>Hauteur haute</label><div class="unit"><input data-c="hmax" inputmode="decimal" value="${s.hmax ?? 180}"><span>cm</span></div></div><p>Sous 180 cm, la surface n'est pas comptée comme habitable ; le parquet, lui, se pose dessous.</p>`;
    if (s.kind === 'meuble') h += furnitureDims(s);
    if (s.kind === 'escalier') { const cands = App.stairs.candidates(s); h += `<h3>Forme</h3><p style="color:var(--ink);font-weight:700;margin:0 0 6px">${esc(App.stairs.kindName(s))}</p><div class="row"><button class="btn sm" data-x="stflip">Inverser départ / arrivée</button></div>${cands.length ? `<div class="preview"><b>Assembler</b> — une partie de l'escalier a été lue comme une pièce à part ? Réunissez-les : la forme (droite, en L ou en U) et les marches tournantes sont recalculées.<div class="row" style="margin-top:8px;flex-wrap:wrap">${cands.map((o) => `<button class="btn sm red" data-x="stjoin" data-v="${o.id}">Avec ${esc(o.name || (o.kind === 'escalier' ? 'l\'escalier' : 'la pièce'))} (${App.fmtM2(Math.abs(G.area(o.pts)))} m²)</button>`).join('')}</div></div>` : ''}<p class="hint2">Le rond marque le départ, la flèche l'arrivée ; les marches sont réparties sur la ligne de foulée et tournent dans les angles.</p>`; }
    if (s.kind === 'escalier') h += `<h3>Escalier</h3><div class="seg"><button data-a="stairdir" data-v="monte" aria-pressed="${!(s.stair && s.stair.dir === 'descend')}">Monte depuis cet étage</button><button data-a="stairdir" data-v="descend" aria-pressed="${!!(s.stair && s.stair.dir === 'descend')}">Descend (trémie)</button></div><div class="field"><label>Nombre de marches</label><input data-c="steps" inputmode="numeric" value="${(s.stair && s.stair.steps) || ''}"></div>`;
    if (s.kind !== 'piece' && s.kind !== 'escalier') h += `<h3>Rotation</h3><div class="row"><button class="btn sm" data-a="rot" data-v="-90">−90°</button><button class="btn sm" data-a="rot" data-v="-15">−15°</button><button class="btn sm" data-a="rot" data-v="15">+15°</button><button class="btn sm" data-a="rot" data-v="90">+90°</button><button class="btn sm" data-a="mirror">Miroir</button>${s.kind === 'meuble' && s.pts.length >= 4 ? '<button class="btn sm" data-x="backwall">Dos au mur</button>' : ''}</div>${s.kind === 'meuble' ? '<p class="hint2">Glissez le meuble : il se colle aux murs et aux autres meubles, et se centre sur la cloison, la fenêtre ou entre deux murs. Les distances libres s\'affichent autour.</p>' : ''}`;
    // cotes
    h += `<h3>Cotes et angles</h3><p>Touchez une valeur pour la modifier. Verrouillez les cotes mesurées : les autres s'ajustent pour fermer la forme.</p>
      <table class="dims"><thead><tr><th>Mur</th><th>Longueur (cm)</th><th></th><th>Angle (°)</th><th></th><th></th></tr></thead><tbody>
      ${s.pts.map((_, i) => { const lk = s.locks[i] || {}; return `<tr><td>${s.kind === 'piece' ? `<button class="wname${lk.P ? ' lk' : ''}" data-x="wsel" data-v="${i}" title="Sélectionner ce mur">${wallName(i, n)}</button>` : wallName(i, n)}</td><td><input data-c="L" data-i="${i}" inputmode="decimal" value="${fmt(m.L[i] / 10)}" ${s.locked ? 'disabled' : ''}></td><td><button class="lock" data-a="lockL" data-i="${i}" aria-pressed="${!!lk.L}" title="Verrouiller la longueur">${lk.L ? LOCK : UNLOCK}</button></td><td><input data-c="A" data-i="${i}" inputmode="decimal" value="${fmt(G.deg(m.A[i]), 2)}" ${s.locked ? 'disabled' : ''}></td><td><button class="lock" data-a="lockA" data-i="${i}" aria-pressed="${!!lk.A}" title="Verrouiller l'angle en ${String.fromCharCode(65 + i)}">${lk.A ? LOCK : UNLOCK}</button></td><td><button class="lock" data-a="split" data-i="${i}" title="Ajouter un point au milieu du mur">+</button></td></tr>`; }).join('')}
      </tbody></table>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-a="lockAll">Tout verrouiller</button><button class="btn sm" data-a="unlockAll">Tout déverrouiller</button><button class="btn sm" data-a="square">Mettre d'équerre</button>${n > 3 ? '<button class="btn sm" data-a="delv">Retirer un point…</button>' : ''}</div>`;
    if (s.kind === 'piece') h += openingsUI(s) + calUI(s);
    return h;
  }

  function furnitureDims(s) {
    if (s.pts.length !== 4) return '';
    const w = G.dist(s.pts[0], s.pts[1]), d = G.dist(s.pts[1], s.pts[2]);
    return `<h3>Dimensions</h3><div class="field"><label>Largeur</label><div class="unit"><input data-c="fw" inputmode="decimal" value="${fmt(w / 10)}"><span>cm</span></div></div><div class="field"><label>Profondeur</label><div class="unit"><input data-c="fd" inputmode="decimal" value="${fmt(d / 10)}"><span>cm</span></div></div>
      <div class="field"><label>Pas de parquet dessous</label><input type="checkbox" data-c="noParquet" ${s.noParquet ? 'checked' : ''}></div>`;
  }

  function openingsUI(s) {
    const ops = (s.openings || []).filter((o) => o.sw !== 0 || !App.ops.twin(s, o) || true);
    const seen = new Set(); const items = [];
    for (const o of ops) { const pr = App.ops.primary(s, o); if (seen.has(pr.o.oid)) continue; seen.add(pr.o.oid); items.push({ o, pr }); }
    return `<h3>Portes et fenêtres</h3>${items.length ? `<div class="list">${items.map(({ o, pr }) => `<button class="item" data-x="opsel" data-v="${pr.o.oid}"><span class="nm">${esc(App.ops.name(o.type))}</span><span class="meta">${esc(App.ops.describe(s, o))}</span><span class="v">${App.fmtCm(o.width, 0)}<small style="font-size:12px"> cm</small></span></button>`).join('')}</div>` : '<p>Aucune ouverture.</p>'}
      <div class="row" style="margin-top:10px"><button class="btn sm" data-x="optool">+ Ajouter sur le plan</button></div>
      <p class="hint2">Touchez une porte sur le plan pour l'inverser, changer ses gonds ou la supprimer.</p>`;
  }

  function calUI(s) {
    const n = s.pts.length; const c = s.cal || {};
    const groups = ['', 'A', 'B', 'C', 'D'];
    const res = (App.calepinage().results || {})[s.id];
    return `<h3>Calepinage de cette pièce</h3>
      <div class="field"><label>Sens des lames</label><select data-c="cal.dir"><option value="auto" ${c.dir == null || c.dir === 'auto' ? 'selected' : ''}>Automatique${res ? ' (' + fmt(((G.deg(res.ang) % 180) + 180) % 180, 0) + '°)' : ''}</option>${s.pts.map((p, i) => { const q = s.pts[(i + 1) % n]; let a = ((G.deg(Math.atan2(q.y - p.y, q.x - p.x)) % 180) + 180) % 180; return `<option value="${a.toFixed(3)}" ${c.dir != null && c.dir !== 'auto' && Math.abs(+c.dir - a) < 0.01 ? 'selected' : ''}>Parallèle au mur ${wallName(i, n)}</option>`; }).join('')}</select></div>
      <div class="field"><label>Mur de départ</label><select data-c="cal.start"><option value="auto">Automatique</option>${s.pts.map((_, i) => `<option value="${i}" ${String(c.start) === String(i) ? 'selected' : ''}>${wallName(i, n)}</option>`).join('')}</select></div>
      <div class="field"><label>Pose continue avec</label><select data-c="cal.group">${groups.map((g) => `<option value="${g}" ${(c.group || '') === g ? 'selected' : ''}>${g ? 'Groupe ' + g : 'Pièce indépendante'}</option>`).join('')}</select></div>
      <p>Les pièces d'un même groupe partagent le sens des lames et l'alignement des rangs, pour une pose continue sous les portes.</p>
      <button class="btn sm" data-a="seeCal">Voir le calepinage</button>`;
  }

  function inspElec(p) {
    const types = PL.lib.elec;
    return `<h2>${esc((types.find((t) => t.id === p.type) || {}).name || 'Point')}</h2>
      <div class="field" style="border-top:1px solid var(--ink)"><label>Type</label><select data-c="p.type">${types.map((t) => `<option value="${t.id}" ${p.type === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}</select></div>
      <div class="field"><label>Hauteur</label><div class="unit"><input data-c="p.h" inputmode="decimal" value="${p.h != null ? p.h : ''}"><span>cm du sol</span></div></div>
      <div class="field"><label>Note</label><input data-c="p.note" value="${esc(p.note || '')}" placeholder="circuit, usage…"></div>
      <div class="row" style="margin-top:12px"><button class="btn sm" data-a="prot">Pivoter</button><button class="btn sm ${p.locked ? 'primary' : ''}" data-a="lockpos">${p.locked ? 'Verrouillé' : 'Verrouiller'}</button><button class="btn sm" data-a="pdup">Dupliquer</button><button class="btn sm ghost" data-a="del">Supprimer</button></div>
      <p class="note">Faites glisser le symbole sélectionné pour le déplacer : il se cale sur le mur le plus proche.</p>`;
  }
  function inspMeasure(m) {
    const L = G.dist(m.a, m.b); const ang = ((G.deg(Math.atan2(m.b.y - m.a.y, m.b.x - m.a.x)) % 180) + 180) % 180;
    return `<div class="big">${App.fmtCm(L)}<small>cm</small></div><p>${fmt(L, 0)} mm · ${fmt(ang, 1)}°</p>
      <div class="field" style="border-top:1px solid var(--ink)"><label>Libellé</label><input data-c="m.label" value="${esc(m.label || '')}" placeholder="ex. niche, radiateur…"></div>
      <div class="row" style="margin-top:12px"><button class="btn sm" data-a="mtool">Nouvelle mesure</button><button class="btn sm ghost" data-a="del">Supprimer</button></div>
      <p class="note">Faites glisser une extrémité de la cote sélectionnée pour l'ajuster ; elle s'aimante sur les angles et les murs.</p>`;
  }

  /* ----- Calepinage ----- */
  function stepView() {
    const st = S.step, r = App.byId(st.id), cal = App.calepinage(), res = cal.results[st.id], P = S.p.parquet;
    if (!r || !res) { S.step = null; return panelCal(); }
    const row = res.rows[st.row - 1]; const rip = row.ripMax < P.W - 0.5;
    const pcs = row.runs.flatMap((ru, k) => ru.pieces.map((pc, i) => ({ ...pc, run: k, first: i === 0, last: i === ru.pieces.length - 1 })));
    const chip = (pc) => `<div style="flex:none;border:1px solid ${pc.kind === 'cut' ? 'var(--red)' : 'var(--ink)'};padding:8px 10px;min-width:74px;background:${pc.kind === 'cut' ? 'color-mix(in srgb,var(--red) 8%,var(--paper))' : 'var(--paper)'}"><div style="font-weight:200;font-size:26px;line-height:1;letter-spacing:-.02em;color:${pc.kind === 'cut' ? 'var(--red)' : 'var(--ink)'}">${Math.round(pc.len)}</div><div style="font-size:11px;color:var(--ink-2);margin-top:4px">${pc.kind === 'full' ? 'entière' : pc.src === 'chute' ? 'chute du rang ' + (pc.from || '?') : 'à couper'}</div></div>`;
    const keeps = pcs.filter((pc) => pc.rest > 0).map((pc) => Math.round(pc.rest));
    return `<button class="link" data-a="stepEnd">← Fin du pas à pas</button>
      <h2 style="margin-top:10px">${esc(r.name || 'Pièce')}</h2><p class="lead">Rang ${st.row} sur ${res.rows.length}${st.row === 1 ? ' — le long du mur de départ' : ''}</p>
      <div class="kpis" style="grid-template-columns:1fr 1fr"><div><b style="${rip ? 'color:var(--red)' : ''}">${rip ? Math.round(row.ripMax) : P.W}</b><span>${rip ? 'mm : lames délignées' + (row.ripMax - row.ripMin > 2 ? ' en biais (' + Math.round(row.ripMin) + '–' + Math.round(row.ripMax) + ')' : '') : 'mm : largeur entière'}</span></div><div><b>${pcs.length}</b><span>lames dans ce rang</span></div></div>
      <p style="margin:4px 0 8px">Ordre de pose depuis l'angle de départ, longueurs en mm :</p>
      <div class="pcs">${pcs.map(chip).join('<i>›</i>')}</div>
      ${keeps.length ? `<p class="note">Gardez ${keeps.map((k) => k + ' mm').join(' et ')} de chute pour un rang suivant.</p>` : ''}
      ${row.warn.length ? `<p class="note">${esc(row.warn.join(' ; '))}</p>` : ''}
      <div class="row" style="margin-top:14px"><button class="btn" data-a="stepGo" data-v="-1" ${st.row <= 1 ? 'disabled' : ''} style="flex:1">‹ Rang précédent</button><button class="btn primary" data-a="stepGo" data-v="1" ${st.row >= res.rows.length ? 'disabled' : ''} style="flex:1">Rang suivant ›</button></div>`;
  }
  function panelCal() {
    if (S.step) return stepView();
    const cal = App.calepinage(); const P = S.p.parquet; const rooms = App.rooms(); const t = cal.totals;
    const pr = (k, label, unit, step = 'any') => `<div class="field"><label>${label}</label><div class="unit"><input data-c="pq.${k}" inputmode="decimal" value="${P[k] ?? ''}"><span>${unit}</span></div></div>`;
    let h = `<h2>Calepinage · ${esc(App.floor().name)}</h2><p class="lead">${esc(P.name || 'Parquet')} — ${P.L} × ${P.W} mm, ${P.pattern === 'anglaise' ? 'pose à l\'anglaise' : P.pattern === 'pont12' ? 'pont de bateau ½' : 'pont de bateau ⅓'}</p>
      <div class="kpis"><div><b>${fmt(t.area, 1)}</b><span>m² de parquet</span></div><div><b>${t.boards}</b><span>lames entamées</span></div><div><b>${t.boxes ?? '—'}</b><span>paquets${t.perBox ? ' de ' + t.perBox : ''}</span></div></div>
      <p>${t.reused} chutes réemployées en début ou fin de rang. Estimation à la surface + ${P.waste} % : ${t.boardsArea} lames${t.boxesArea ? ' (' + t.boxesArea + ' paquets)' : ''}.</p>
      <div class="legend"><span><i style="background:var(--oak)"></i>Lame entière</span><span><i style="background:var(--oak);border-right:3px solid var(--red)"></i>Coupe (trait rouge)</span><span><i style="background:var(--oak-reuse)"></i>Chute réemployée</span><span style="color:var(--red);font-weight:600">73 mm</span><span>rang déligné</span></div>
      ${S.mode !== 'calepinage' ? '<button class="btn primary" data-a="mode" data-v="calepinage" style="margin:6px 0">Afficher les lames sur le plan</button>' : ''}
      <details ${S.pqOpen ? 'open' : ''} data-d="pq"><summary>Référence du parquet</summary>
        <div class="field"><label>Nom</label><input data-c="pq.name" value="${esc(P.name || '')}"></div>
        ${pr('L', 'Longueur de lame', 'mm')}${pr('W', 'Largeur utile', 'mm')}${pr('T', 'Épaisseur', 'mm')}
        <div class="field"><label>Motif</label><select data-c="pq.pattern"><option value="anglaise" ${P.pattern === 'anglaise' ? 'selected' : ''}>À l'anglaise (coupe perdue)</option><option value="pont12" ${P.pattern === 'pont12' ? 'selected' : ''}>Pont de bateau ½</option><option value="pont13" ${P.pattern === 'pont13' ? 'selected' : ''}>Pont de bateau ⅓</option></select></div>
        <div class="field"><label>Pose</label><select data-c="pq.lay"><option value="flottante" ${P.lay === 'flottante' ? 'selected' : ''}>Flottante (clipsée)</option><option value="collee" ${P.lay === 'collee' ? 'selected' : ''}>Collée</option><option value="clouee" ${P.lay === 'clouee' ? 'selected' : ''}>Clouée</option></select></div>
        ${pr('gap', 'Jeu périphérique', 'mm')}${pr('minStagger', 'Décalage mini des joints', 'mm')}${pr('minPiece', 'Longueur mini d\'une coupe', 'mm')}${pr('minRow', 'Largeur mini d\'un rang', 'mm')}${pr('perBox', 'Lames par paquet', 'lames')}${pr('waste', 'Marge de chute', '%')}
        <p>Valeurs par défaut courantes ; suivez la notice du fabricant si elle diffère.</p>
      </details>`;
    if (!rooms.length) return h + '<p class="note">Aucune pièce sur cet étage : importez un plan ou tracez les pièces.</p>';
    const ord = App.feat.order(S.p.floorId);

    for (const r of rooms) {
      const res = cal.results[r.id];

      if (r.parquet === false) { h += `<p>Pas de parquet dans cette pièce. <button class="link" data-a="pqon" data-v="${r.id}">Activer</button></p>`; continue; }

        <ol class="advice">${res.advice.map((a) => `<li class="${a.warn ? 'warn' : ''}">${esc(a.s)}</li>`).join('')}</ol>
        <div class="row"><button class="btn sm primary" data-a="step" data-v="${r.id}">Pas à pas</button><button class="btn sm" data-a="opt" data-v="${r.id}">Optimiser</button><button class="btn sm" data-a="calzoom" data-v="${r.id}">Zoomer</button><button class="btn sm" data-a="sel" data-v="${r.id}">Réglages</button></div>
        ${S.optFor === r.id && S.optRes ? `<table class="cuts" style="margin-top:10px"><thead><tr><th>Variante</th><th>Lames</th><th>Chute</th><th>1er / dernier</th><th></th></tr></thead><tbody>${S.optRes.map((o, i) => { const n = r.pts.length; const wn = (k) => String.fromCharCode(65 + k) + String.fromCharCode(65 + ((k + 1) % n)); return `<tr><td style="text-align:left">∥ ${wn(o.wallDir)} · départ ${o.startIdx != null ? wn(o.startIdx) : 'auto'}${o.warns ? ' <span class="tag red">' + o.warns + '</span>' : ''}</td><td>${o.boards}</td><td>${Math.round(o.waste * 100)} %</td><td>${Math.round(o.first)} / ${Math.round(o.last)}</td><td><button class="link" data-a="optApply" data-v="${i}">Appliquer</button></td></tr>`; }).join('')}</tbody></table><p>Variantes classées : moins d'alertes, puis moins de lames, puis moins de chute.</p>` : ''}
        <details><summary>Fiche de coupe rang par rang</summary>${cutTable(res, P)}</details>`;

    h += `<h3>Liste de courses · ${esc(App.floor().name)}</h3><div class="list">

      ${row('Plinthes', fmt(sh.plinth, 1) + ' m', sh.plinthBars + ' barres de 2,40 m, portes déduites, +10 %')}
      ${row('Barres de seuil', String(sh.seuils.length), sh.seuils.length ? 'largeurs ' + sh.seuils.map((w) => App.fmtCm(w, 0)).join(', ') + ' cm' : '')}

  function cutTable(res, P) {
    return `<table class="cuts"><thead><tr><th>Rang</th><th>Largeur</th><th>1re lame</th><th>Dernière</th><th>Lames</th></tr></thead><tbody>${res.rows.map((r) => r.runs.map((ru, k) => { const f = ru.pieces[0], l = ru.pieces[ru.pieces.length - 1]; const rip = r.ripMax < P.W - 0.5; return `<tr><td>${k ? '' : r.num}</td><td class="${rip ? 'r' : ''}">${k ? '' : rip ? Math.round(r.ripMax) + ' mm' : 'entière'}</td><td class="${f.kind === 'cut' ? 'r' : ''}">${Math.round(f.len)}${f.src === 'chute' ? '*' : ''}</td><td class="${ru.pieces.length > 1 && l.kind === 'cut' ? 'r' : ''}">${ru.pieces.length > 1 ? Math.round(l.len) + (l.src === 'chute' ? '*' : '') : '—'}</td><td>${ru.pieces.length}</td></tr>`; }).join('')).join('')}</tbody></table><p>Longueurs en mm, rangs numérotés depuis le mur de départ. * chute réemployée.</p>`;
  }
  ui.ficheText = () => {
    const cal = App.calepinage(); const P = S.p.parquet; const lines = [];
    lines.push(`CALEPINAGE — ${S.p.name} — ${App.floor().name}`, `${P.name} : ${P.L} × ${P.W} mm, ${P.pattern}, pose ${P.lay}`, `Total : ${cal.totals.area.toFixed(2)} m², ${cal.totals.boards} lames, ${cal.totals.boxes ?? '?'} paquets`, '');
    for (const r of App.rooms()) {

      lines.push(`== ${r.name} — ${(res.area / 1e6).toFixed(2)} m², ${res.rows.length} rangs`); res.advice.forEach((a, i) => lines.push(`${i + 1}. ${a.s}`));
      lines.push('Rang | largeur | 1re lame | dernière'); res.rows.forEach((row) => row.runs.forEach((ru, k) => { const f = ru.pieces[0], l = ru.pieces[ru.pieces.length - 1]; lines.push(`${k ? '  ' : row.num} | ${row.ripMax < P.W - 0.5 ? Math.round(row.ripMax) + ' mm' : 'entière'} | ${Math.round(f.len)} | ${ru.pieces.length > 1 ? Math.round(l.len) : '-'}`); })); lines.push('');

  };

  /* ----- Mobilier ----- */
  function svgFor(it) {
    const w = it.w, d = it.d, sc = Math.min(120 / Math.max(w, 1), 38 / Math.max(d, 1)); const W = w * sc, D = d * sc, x = (130 - W) / 2, y = (42 - D) / 2;
    if (it.round) return `<svg viewBox="0 0 130 42"><ellipse cx="65" cy="21" rx="${W / 2}" ry="${D / 2}"/></svg>`;
    if (it.shape === 'L') { const t = (it.t || 60) * sc; return `<svg viewBox="0 0 130 42"><path d="M${x} ${y}h${W}v${t}h${-(W - t)}v${D - t}h${-t}z"/></svg>`; }
    return `<svg viewBox="0 0 130 42"><rect x="${x}" y="${y}" width="${W}" height="${D}"/>${/^lit/.test(it.id) ? `<path d="M${x} ${y + D * 0.12}h${W}"/>` : ''}</svg>`;
  }
  function panelMob() {
    const cats = {}; PL.lib.furniture.concat(PL.lib.structure).forEach((it) => { (cats[it.cat] = cats[it.cat] || []).push(it); });
    const placed = App.shapesOn().filter((s) => s.kind === 'meuble');
    return `<h2>Mobilier</h2><p class="lead">Touchez un élément pour le poser au centre de la vue, puis déplacez-le avec la poignée rouge. Dimensions indicatives, toutes modifiables.</p>

      ${placed.length ? `<h3>Posés sur cet étage</h3><div class="list">${placed.map((s) => `<button class="item" data-a="sel" data-v="${s.id}"><span class="nm">${esc(s.name)}</span>${s.locked ? '<span class="tag">verrouillé</span>' : ''}<span class="meta">${App.fmtCm(G.dist(s.pts[0], s.pts[1]), 0)} × ${App.fmtCm(G.dist(s.pts[1], s.pts[2]), 0)}</span></button>`).join('')}</div>` : ''}`;
  }

  }

  /* ----- Projet ----- */
  function panelProjet() {

  /* ---------- clics ---------- */
  async function onPanelClick(e) {

      case 'sel': { S.sel = { id: v }; const x = App.byId(v); if (x && x.pts) App.fitShape(x); else if (x && x.a) App.fitBox(G.bbox([x.a, x.b])); ui.refresh(); App.render(); break; }
      case 'calzoom': { const x = App.byId(v); if (S.mode !== 'calepinage') ui.setMode('calepinage'); App.fitShape(x); break; }
      case 'addRect': { const r = await ui.dialog('Nouvelle pièce', `<div class="field"><label>Nom</label><input name="n" value="Pièce ${App.rooms().length + 1}"></div><div class="field"><label>Largeur</label><div class="unit"><input name="w" inputmode="decimal" value="400"><span>cm</span></div></div><div class="field"><label>Longueur</label><div class="unit"><input name="l" inputmode="decimal" value="350"><span>cm</span></div></div><div class="field"><label>Angles droits verrouillés</label><input type="checkbox" name="sq" checked></div>`, [{ label: 'Annuler', cls: 'ghost' }, { label: 'Créer', cls: 'primary', def: true }]);
        if (r.i !== 1) break; const w = num(r.vals.w) * 10, l = num(r.vals.l) * 10; if (!w || !l) break;
        const bb = App.floorBBox(); const x0 = bb ? bb.x1 + 600 : 0, y0 = bb ? bb.y0 : 0;
        const sh = App.makeShape('piece', G.rect(x0, y0, w, l), { name: r.vals.n || 'Pièce' }); if (r.vals.sq) sh.locks = PL.solver.syncLocks(sh.pts, sh.pts.map(() => ({ L: false, A: true })));
        App.mutate((P) => P.shapes.push(sh)); S.sel = { id: sh.id }; App.fitShape(sh); ui.refresh(); break; }
      case 'draw': S.drawKind = 'piece'; ui.setTool('draw'); if (innerWidth < 900) ui.sheet('min'); break;
      case 'drawKind': S.drawKind = v; S.draft = null; ui.setTool('draw'); if (innerWidth < 900) ui.sheet('min'); App.toast('Tracez la zone point par point'); break;
      case 'merge': { const o = App.byId(document.getElementById('mergeWith').value); if (!o) break; const m = App.feat.merge(s, o); if (m) { S.sel = { id: m.id }; App.toast('Pièces fusionnées'); ui.refresh(); } break; }
      case 'opt': { const r = App.byId(v); S.optFor = v; S.optRes = App.feat.optimize(r); ui.refresh(); break; }
      case 'optApply': { const r = App.byId(S.optFor); const o = S.optRes[+v]; App.mutate(() => { r.cal = Object.assign({}, r.cal, { dir: o.dir.toFixed(3), start: o.startIdx != null ? String(o.startIdx) : 'auto' }); }); S.optRes = null; S.optFor = null; App.toast('Variante appliquée'); break; }
      case 'step': S.step = { id: v, row: 1 }; if (S.mode !== 'calepinage') S.mode = 'calepinage'; App.fitShape(App.byId(v)); ui.refresh(); App.render(); break;
      case 'stepGo': { const res = App.calepinage().results[S.step.id]; S.step.row = Math.max(1, Math.min(res.rows.length, S.step.row + (+v))); ui.refresh(); App.render(); break; }
      case 'stepEnd': S.step = null; ui.refresh(); App.render(); break;
      case 'addLib': ui.placeLib(PL.lib.structure.find((x) => x.id === v)); break;
      case 'lib': ui.placeLib(PL.lib.furniture.concat(PL.lib.structure).find((x) => x.id === v)); if (innerWidth < 900) ui.sheet('min'); break;
      case 'etype': S.elecType = v; if (S.mode !== 'elec') { S.mode = 'elec'; } ui.setTool('elec'); if (innerWidth < 900) ui.sheet('min'); break;
      case 'lockpos': App.mutate(() => { s.locked = !s.locked; }); break;
      case 'zoom': App.fitShape(s); break;
      case 'dup': { const c = JSON.parse(JSON.stringify(s)); c.id = App.uid(); c.pts = c.pts.map((p) => ({ x: p.x + 400, y: p.y - 400 })); c.locked = false; c.name = (s.name || '') + (s.kind === 'piece' ? ' (copie)' : ''); App.mutate((P) => P.shapes.push(c)); S.sel = { id: c.id }; ui.refresh(); break; }
      case 'pdup': { const c = Object.assign({}, s, { id: App.uid(), x: s.x + 300, locked: false }); App.mutate((P) => P.points.push(c)); S.sel = { id: c.id }; break; }
      case 'del': ui.deleteSelected(); break;
      case 'rot': if (s.locked) break; App.mutate(() => { const c = G.centroid(s.pts); s.pts = s.pts.map((p) => G.rotAround(p, c, G.rad(+v))); }); break;
      case 'mirror': if (s.locked) break; App.mutate(() => { const c = G.centroid(s.pts); s.pts = s.pts.map((p) => ({ x: 2 * c.x - p.x, y: p.y })).reverse(); s.locks = PL.solver.syncLocks(s.pts, s.pts.map(() => ({ L: false, A: false }))); }); break;
      case 'prot': if (s.locked) break; App.mutate(() => { s.rot = (s.rot || 0) + Math.PI / 2; }); break;
      case 'stairdir': App.mutate(() => { s.stair = Object.assign({}, s.stair, { dir: v }); }); break;
      case 'lockL': case 'lockA': { const i = +b.dataset.i, k = a === 'lockL' ? 'L' : 'A'; App.mutate(() => { s.locks[i][k] = !s.locks[i][k]; s.locks = PL.solver.syncLocks(s.pts, s.locks); }); break; }
      case 'lockAll': App.mutate(() => { s.locks = PL.solver.syncLocks(s.pts, s.pts.map(() => ({ L: true, A: true }))); s.locks[s.locks.length - 1].L = false; s.locks[0].A = false; s.locks[s.locks.length - 1].A = false; s.locks = PL.solver.syncLocks(s.pts, s.locks); }); App.toast('Cotes verrouillées (un mur et deux angles restent libres pour fermer la forme)'); break;

      case 'square': { const r = PL.solver.squareUp(s.pts, s.locks); if (!r.ok) { App.toast(r.msg); break; } App.mutate(() => { s.pts = r.pts; s.locks = PL.solver.syncLocks(s.pts, s.locks.map((l, i) => { const d = G.deg(PL.solver.measure(r.pts).A[i]); return Object.assign({}, l, { A: l.A || Math.abs(d - 90) < 0.01 || Math.abs(d - 270) < 0.01 }); })); }); App.toast('Angles droits appliqués et verrouillés'); break; }
      case 'split': { const i = +b.dataset.i; App.mutate(() => { const n = s.pts.length; const m = G.lerp(s.pts[i], s.pts[(i + 1) % n], 0.5); s.pts.splice(i + 1, 0, m); s.locks.splice(i + 1, 0, { L: false, A: false }); s.locks[i] = Object.assign({}, s.locks[i], { L: false }); (s.openings || []).forEach((o) => { if (o.wall > i) o.wall++; }); s.locks = PL.solver.syncLocks(s.pts, s.locks); }); break; }
      case 'delv': { const n = s.pts.length; const r = await ui.dialog('Retirer un point', `<div class="field"><label>Point</label><select name="v">${s.pts.map((_, i) => `<option value="${i}">${String.fromCharCode(65 + i)}</option>`).join('')}</select></div>`, [{ label: 'Annuler', cls: 'ghost' }, { label: 'Retirer', cls: 'red', def: true }]); if (r.i !== 1) break; const i = +r.vals.v; const np = s.pts.filter((_, k) => k !== i); if (G.isSelfIntersecting(np)) { App.toast('Impossible : la forme se croiserait'); break; } App.mutate(() => { s.pts = np; s.locks.splice(i, 1); s.locks = s.locks.map((l) => ({ L: false, A: l.A })); s.locks = PL.solver.syncLocks(s.pts, s.locks); s.openings = (s.openings || []).filter((o) => o.wall !== i && o.wall !== (i - 1 + n) % n).map((o) => Object.assign(o, { wall: o.wall > i ? o.wall - 1 : o.wall })); }); break; }
      case 'cut': ui.setTool('cut'); if (innerWidth < 900) ui.sheet('min'); break;
      case 'seeCal': ui.setMode('calepinage'); S.sel = { id: s.id }; App.fitShape(s); ui.refresh(); break;
      case 'o.add': { const t = $('newOpType').value, w = +$('newOpWall').value; const def = PL.lib.openings.find((x) => x.id === t); const n = s.pts.length; const el = G.dist(s.pts[w], s.pts[(w + 1) % n]); const width = Math.min(def.w, el - 100); App.mutate(() => { s.openings.push({ type: t, wall: w, pos: Math.max(0, (el - width) / 2), width, h: def.h, sill: def.sill, sw: 1 }); }); S.openOpen = s.openings.length - 1; ui.refresh(); break; }
      case 'o.del': { const k = +b.dataset.k; App.mutate(() => { s.openings.splice(k, 1); }); break; }
      case 'o.hinge': { const k = +b.dataset.k; App.mutate(() => { s.openings[k].hinge = v; }); S.openOpen = k; break; }
      case 'o.sw': { const k = +b.dataset.k; App.mutate(() => { const o = s.openings[k]; if (v === 'out') { o.out = true; o.sw = 1; } else { o.out = false; o.sw = +v; } }); S.openOpen = k; break; }
      case 'pqon': App.mutate((P) => { const r = P.shapes.find((x) => x.id === v); if (r) r.parquet = true; }); break;
      case 'copyFiche': try { await navigator.clipboard.writeText(ui.ficheText()); App.toast('Fiche copiée'); } catch (err) { App.toast('Copie refusée par le navigateur'); } break;
      case 'dlFiche': App.download(`calepinage-${App.floor().name}.txt`, ui.ficheText(), 'text/plain'); break;
      case 'dlPng': { const blob = await App.exportPNG(); if (blob) App.download(`plan-${App.floor().name}.png`, blob, 'image/png'); break; }
      case 'mtool': S.sel = null; ui.setTool('measure'); break;

  const St = (App.stairs = {});

  /* ---------- lecture de la forme ---------- */
  St.layout = (s) => {
    const fr = O.frame(O.angleOf(s.pts)); const P = O.square(s.pts.map(fr.to)); if (!P) return null;
    const xs = O.coords(P.map((p) => p.x), 3), ys = O.coords(P.map((p) => p.y), 3);
    const cells = [];
    for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) { const c = { x: (xs[i] + xs[i + 1]) / 2, y: (ys[j] + ys[j + 1]) / 2 }; if (G.pointInPoly(c, P)) cells.push({ i, j, x0: xs[i], x1: xs[i + 1], y0: ys[j], y1: ys[j + 1], c }); }
    if (!cells.length || cells.length > 12) return null;
    const key = (i, j) => i + ',' + j; const at = new Map(cells.map((c) => [key(c.i, c.j), c]));
    const nb = (c) => [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([a, b]) => at.get(key(c.i + a, c.j + b))).filter(Boolean);
    let chain;
    if (cells.length === 1) chain = cells;
    else {
      if (cells.some((c) => nb(c).length > 2)) return null; const ends = cells.filter((c) => nb(c).length === 1); if (ends.length !== 2) return null;
      chain = [ends[0]]; const seen = new Set([ends[0]]);
      while (chain.length < cells.length) { const n = nb(chain[chain.length - 1]).find((x) => !seen.has(x)); if (!n) return null; seen.add(n); chain.push(n); }
    }
    // ligne de foulée (dans le repère)
    const dir = (a, b) => ({ x: Math.sign(b.i - a.i), y: Math.sign(b.j - a.j) });
    const pts = [], corners = [];
    if (chain.length === 1) { const c = chain[0]; const hor = c.x1 - c.x0 >= c.y1 - c.y0; pts.push(hor ? { x: c.x0, y: c.c.y } : { x: c.c.x, y: c.y0 }, hor ? { x: c.x1, y: c.c.y } : { x: c.c.x, y: c.y1 }); }
    else {
      const d0 = dir(chain[0], chain[1]), c0 = chain[0]; pts.push({ x: d0.x ? (d0.x > 0 ? c0.x0 : c0.x1) : c0.c.x, y: d0.y ? (d0.y > 0 ? c0.y0 : c0.y1) : c0.c.y });
      for (let k = 1; k < chain.length - 1; k++) {
        const a = dir(chain[k - 1], chain[k]), b = dir(chain[k], chain[k + 1]); if (a.x === b.x && a.y === b.y) continue; const c = chain[k];
        pts.push(c.c); const dx = b.x - a.x, dy = b.y - a.y; corners.push({ cell: c, inner: { x: dx > 0 ? c.x1 : dx < 0 ? c.x0 : c.c.x, y: dy > 0 ? c.y1 : dy < 0 ? c.y0 : c.c.y } });
      }
      const n = chain.length, d1 = dir(chain[n - 2], chain[n - 1]), c1 = chain[n - 1]; pts.push({ x: d1.x ? (d1.x > 0 ? c1.x1 : c1.x0) : c1.c.x, y: d1.y ? (d1.y > 0 ? c1.y1 : c1.y0) : c1.c.y });
    }
    let path = pts, cs = corners;
    // sens : du départ (bas de l'escalier) vers l'arrivée
    const st = s.stair && s.stair.start ? fr.to(s.stair.start) : null;
    if (st && G.dist(st, path[path.length - 1]) < G.dist(st, path[0])) { path = path.slice().reverse(); cs = cs.slice().reverse(); }
    const segs = []; let L = 0; for (let k = 1; k < path.length; k++) { const l = G.dist(path[k - 1], path[k]); segs.push({ a: path[k - 1], b: path[k], l, t0: L }); L += l; }
    const kind = cs.length === 0 ? 'Droit' : cs.length === 1 ? 'Quart tournant' : cs.length === 2 ? (G.cross(G.sub(path[1], path[0]), G.sub(path[2], path[1])) * G.cross(G.sub(path[2], path[1]), G.sub(path[3], path[2])) > 0 ? 'Demi-tournant' : 'Deux quarts tournants') : 'Tournant';
    return { fr, cells: chain, path, corners: cs, segs, L, kind };
  };
  St.kindName = (s) => { const l = St.layout(s); return l ? l.kind : 'Forme libre'; };

  /* marches : pour chacune, un segment (repère) — droit dans une volée, rayonnant depuis l'angle intérieur dans un tournant */
  St.treads = (s, lay) => {
    const n = Math.max(2, (s.stair && s.stair.steps) || Math.round(lay.L / 250)); const out = [];
    const pointAt = (t) => { for (const g of lay.segs) if (t <= g.t0 + g.l + 1e-6) { const u = (t - g.t0) / g.l; return { p: G.lerp(g.a, g.b, u), d: G.norm(G.sub(g.b, g.a)) }; } const g = lay.segs[lay.segs.length - 1]; return { p: g.b, d: G.norm(G.sub(g.b, g.a)) }; };
    const cellOf = (p) => lay.cells.find((c) => p.x >= c.x0 - 1 && p.x <= c.x1 + 1 && p.y >= c.y0 - 1 && p.y <= c.y1 + 1);
    const exit = (c, o, u) => { let t = Infinity; if (u.x > 1e-9) t = Math.min(t, (c.x1 - o.x) / u.x); if (u.x < -1e-9) t = Math.min(t, (c.x0 - o.x) / u.x); if (u.y > 1e-9) t = Math.min(t, (c.y1 - o.y) / u.y); if (u.y < -1e-9) t = Math.min(t, (c.y0 - o.y) / u.y); return G.add(o, G.mul(u, t)); };
    for (let k = 1; k < n; k++) {
      const { p, d } = pointAt((k * lay.L) / n); const c = cellOf(p); if (!c) continue; const corner = lay.corners.find((q) => q.cell === c);
      if (corner && G.dist(p, corner.inner) > 1) { const u = G.norm(G.sub(p, corner.inner)); out.push({ a: corner.inner, b: exit(c, corner.inner, u), turn: true }); }
      else { const nrm = { x: -d.y, y: d.x }; out.push({ a: exit(c, p, G.mul(nrm, -1)), b: exit(c, p, nrm) }); }
    }
    // numéros au milieu de chaque marche
    const nums = []; for (let k = 0; k < n; k++) nums.push(pointAt(((k + 0.5) * lay.L) / n).p);
    return { n, lines: out, nums };
  };

  /* ---------- assembler un escalier et une pièce (ou un autre escalier) qui le prolonge ---------- */
  const touches = (A, B) => { for (const p of A) if (G.pointInPoly(p, B) || G.distPointPoly(p, B) < 40) return true; for (const p of B) if (G.pointInPoly(p, A) || G.distPointPoly(p, A) < 40) return true; return false; };
  St.candidates = (s) => App.shapesOn(s.floor).filter((o) => o !== s && (o.kind === 'escalier' || (o.kind === 'piece' && Math.abs(G.area(o.pts)) < 8e6)) && touches(s.pts, o.pts));
  St.stairsTouching = (room) => App.shapesOn(room.floor).filter((o) => o.kind === 'escalier' && touches(o.pts, room.pts));
  St.union = (s, o) => {
    const fr = O.frame(O.angleOf(s.pts)); const A = s.pts.map(fr.to), B = o.pts.map(fr.to);
    const xs = O.coords(A.concat(B).map((p) => p.x)), ys = O.coords(A.concat(B).map((p) => p.y));
    const loops = O.trace(xs, ys, (x, y) => G.pointInPoly({ x, y }, A) || G.pointInPoly({ x, y }, B)).filter((l) => G.area(l) > 0.05e6);
    if (loops.length !== 1) return null;
    return G.cleanPoly(loops[0].map(fr.from), 0.5, 3);
  };
  St.assemble = (s, o) => {
    const pts = St.union(s, o); if (!pts) { App.toast('L\'escalier et cette zone ne se touchent pas'); return false; }
    App.mutate((P) => {
      const far = (() => { const tmp = Object.assign({}, s, { pts, stair: Object.assign({}, s.stair, { start: null }) }); const lay = St.layout(tmp); if (!lay) return null; const oc = lay.fr.to(G.centroid(o.pts)); const a = lay.path[0], b = lay.path[lay.path.length - 1]; return lay.fr.from(G.dist(a, oc) > G.dist(b, oc) ? a : b); })();
      s.pts = G.ensureCCW(pts); s.locks = s.pts.map(() => ({ L: false, A: false })); s.stair = Object.assign({ dir: 'monte' }, s.stair, o.kind === 'escalier' && o.stair && o.stair.steps && s.stair && s.stair.steps ? { steps: s.stair.steps + o.stair.steps } : {}, far ? { start: far } : {});
      P.shapes = P.shapes.filter((x) => x.id !== o.id);
    });
    S.sel = { id: s.id }; App.ui.refresh();
    App.toast(`Escalier ${St.kindName(s).toLowerCase()} — touchez « Inverser » si le départ n'est pas au bon bout`); return true;
  };
  St.flip = (s) => { const lay = St.layout(s); if (!lay) return; App.mutate(() => { s.stair = Object.assign({}, s.stair, { start: lay.fr.from(lay.path[lay.path.length - 1]), userSet: true }); }); };
})();

/* Calepin — démarrage. */
(function () {
  const App = globalThis.App, S = App.state;
  function boot() {
    App.load();
    if (S.p.seeded) { S.mode = 'calepinage'; S.tab = 'calepinage'; }
    const cv = document.getElementById('cv');
    App.readColors(); App.initView(cv); App.initInput(cv); App.ui.init(); App.ctx.init();
    // pièces simples d'abord : une fois par projet, les décrochements de moins de 30 cm sont redressés (annulable)
    if (!S.p.simpleRooms) {
      const all = S.p.floors.flatMap((f) => App.rooms(f.id)); const todo = all.filter((r) => App.walls.countFixable(r));
      if (todo.length) { App.mutate(() => { todo.forEach((r) => App.walls.simplify(r)); S.p.simpleRooms = 1; }); setTimeout(() => App.toast(`${todo.length} pièce${todo.length > 1 ? 's' : ''} simplifiée${todo.length > 1 ? 's' : ''} : décrochements de moins de 30 cm redressés — Annuler pour revenir`), 900); }
      else S.p.simpleRooms = 1;
    }
    requestAnimationFrame(() => { App.fitAll(true); App.importer.ensureBg(S.p.floorId); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => App.render());
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => App.render());
    new MutationObserver(() => App.render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    setTimeout(() => App.cloud.init(), 50);
    window.addEventListener('pagehide', () => App.save());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
